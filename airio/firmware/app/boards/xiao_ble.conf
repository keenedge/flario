CONFIG_FPU=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_PWM=y
# The LSM6DSV16X driver in Zephyr v4.4.2 fails to build when I2C_RTIO is on
# (the BMP581 driver selects it) but LSM6DSV16X_STREAM is off. Enabling the
# async sensor API turns streaming on, which we want for FIFO reads later.
CONFIG_SENSOR_ASYNC_API=y
