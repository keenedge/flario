# West manifest for the airio firmware.
#
# The flario repo is the manifest repository; this file sits in a
# subdirectory, so initialise the workspace with:
#
#   west init -l --mf airio/firmware/west.yml <path-to-flario>
#   west update
#
# Zephyr and the modules are checked out next to the flario checkout.
manifest:
  version: "1.2"

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      import:
        # Only the modules airio needs: CMSIS for the Cortex-M4F, Nordic's
        # HAL for the nRF52840, and ST's HAL for the LSM6DSV16X driver.
        name-allowlist:
          - cmsis_6
          - hal_nordic
          - hal_st

  self:
    path: flario
